plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.devtools.ksp)
    alias(libs.plugins.jetbrains.kotlin.compose)
}

// 开发仓库不保存 Firebase 配置；部署者放入 google-services.json 后才启用资源生成插件。
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace 'com.sakuya.sakuyainandroid'
    compileSdk 35

    defaultConfig {
        applicationId "com.sakuya.sakuyainandroid"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "DEV_SKIP_AUTH", (project.findProperty("devSkipAuth") == "true").toString()
        }
        release {
            buildConfigField "boolean", "DEV_SKIP_AUTH", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures{
        compose = true
        buildConfig = true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

