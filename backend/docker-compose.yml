services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sakuya
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - sakuya_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  sakuya_mysql:
