spring:
  application:
    name: sakuya-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      # EPUB 通常包含封面与插图，管理端上传上限可按部署环境继续收紧。
      max-file-size: ${CONTENT_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${CONTENT_UPLOAD_MAX_REQUEST_SIZE:100MB}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  notifications:
    dispatch-delay-ms: ${NOTIFICATION_DISPATCH_DELAY_MS:15000}
    firebase:
      enabled: ${FIREBASE_ENABLED:false}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7d
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 聊天媒体不映射到公开静态目录，下载必须经过会话成员鉴权；未发送草稿会定期清理。
  chat-media-dir: ${CHAT_MEDIA_DIR:${UPLOAD_DIR:./uploads}/chat}
  chat-media-cleanup-delay-ms: ${CHAT_MEDIA_CLEANUP_DELAY_MS:3600000}
  seed:
    enabled: false
  # 仅部署端配置；为空时 POST/PUT/DELETE /admin/novel-releases 一律拒绝。
  release-management:
    token: ${RELEASE_MANAGEMENT_TOKEN:}
  content-management:
    token: ${CONTENT_MANAGEMENT_TOKEN:}
    read-mode: ${CONTENT_READ_MODE:DB_FIRST_WITH_ADAPTER_FALLBACK}
  content-storage:
    type: ${CONTENT_STORAGE_TYPE:local}
    local-dir: ${CONTENT_STORAGE_LOCAL_DIR:./content-store}
    endpoint: ${CONTENT_STORAGE_ENDPOINT:}
    region: ${CONTENT_STORAGE_REGION:us-east-1}
    bucket: ${CONTENT_STORAGE_BUCKET:sakuya-content}
    access-key: ${CONTENT_STORAGE_ACCESS_KEY:}
    secret-key: ${CONTENT_STORAGE_SECRET_KEY:}

# 内部验证默认关闭；部署 Python 适配服务后以 WENKU8_ADAPTER_ENABLED=true 显式开启。
wenku8:
  adapter:
    base-url: ${WENKU8_ADAPTER_BASE_URL:http://localhost:8000}
    enabled: ${WENKU8_ADAPTER_ENABLED:false}
    # Python 全文接口默认可等待 180 秒；网关额外预留网络传输时间。
    full-content-timeout-seconds: ${WENKU8_FULL_CONTENT_TIMEOUT_SECONDS:195}
  # CDN 下载源：按 aid 直接取整本 UTF-8 TXT，不经过需要 Cloudflare 验证的站点域名。
  # 默认开启：它只在「本地无正文」时被调用，且不携带凭据、不产生登录行为。
  download-source:
    enabled: ${WENKU8_DOWNLOAD_SOURCE_ENABLED:true}
    connect-timeout-seconds: ${WENKU8_DOWNLOAD_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${WENKU8_DOWNLOAD_READ_TIMEOUT_SECONDS:30}
    max-bytes: ${WENKU8_DOWNLOAD_MAX_BYTES:67108864}
  catalog:
    sync:
      # 适配服务未启用时任务会保留旧缓存并跳过外部写入；生产环境可通过环境变量关闭。
      enabled: ${WENKU8_CATALOG_SYNC_ENABLED:true}
      startup-enabled: ${WENKU8_CATALOG_STARTUP_SYNC_ENABLED:true}
      cron: ${WENKU8_CATALOG_SYNC_CRON:0 30 3 * * *}
      zone: ${WENKU8_CATALOG_SYNC_ZONE:Asia/Shanghai}

management:
  endpoints:
    web:
      exposure:
        include: health,info
