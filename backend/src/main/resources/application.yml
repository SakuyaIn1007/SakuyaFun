spring:
  application:
    name: sakuya-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7d
  upload-dir: ${UPLOAD_DIR:./uploads}
  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
