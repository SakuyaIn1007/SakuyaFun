# 演示种子数据
#
# 这是开发/测试环境演示内容的唯一来源，由 DataInitializer 在 app.seed.enabled=true 时导入。
# 增删账号、好友、动态、评论只需改本文件，不需要动 Java 代码。
#
# 编写约定：
# 1. 账号之间用 account 字符串互相引用，不写 UUID（实体 ID 由构造函数生成）。
# 2. 时间用 daysAgo / hoursAgo 相对描述，保证任何一天启动都是一份「最近两周」的新鲜数据。
#    评论的相对时间是相对「所属动态的发布时间」再往后偏移，因此评论一定晚于动态。
# 3. 回复评论用 replyTo 指向本动态评论列表的下标，只能指向更早的评论。
# 4. 导入是幂等的：每条数据都按自然键判断是否已存在，重复启动不会重复插入。
#
# 注意：下列数量被集成测试断言锁定，调整时需同步修改测试：
#   - sakuya 的好友数        -> AuthApiIntegrationTest#sakuyaAccountHasCompleteDemoData
#   - sakuya 的书架书目数（3）-> 同上
#   - sakuya 的会话数（2）    -> 同上
#   - 发给 sakuya 的好友申请只有 rin 一条，且必须是最新一条 -> 同上的 $.data[0].name == "凛"

accounts:
  # —— 原有演示账号 ——
  - account: sakuya
    nickname: 咲夜
    profile:
      signature: 在书页之间，寻找下一段故事。
      gender: 1
      birthday: "2000-10-16"
      regionCode: CN-31
      phoneNumber: "13800138000"
      email: sakuya@example.test
      pokeText: 拍了拍你，并推荐了一本书
      ringtoneName: 星夜阅读
      canBeAddedByStrangers: true
      showProfileToStrangers: true
      muteMessagesFromUnknown: false
  - account: alice
    nickname: 爱丽丝
    profile:
      signature: 把读过的书都记在笔记本里。
      gender: 2
      regionCode: CN-11
  - account: bob
    nickname: 鲍勃
    profile:
      signature: 只看科幻和硬核推理。
      gender: 1
      regionCode: CN-44
  - account: rin
    nickname: 凛
    profile:
      signature: 最近在补轻小说。
      gender: 2
      regionCode: CN-12

  # —— 本次新增账号，用于充实动态流与好友列表 ——
  - account: qianxia
    nickname: 千夏
    profile:
      signature: 夏天适合读短篇。
      gender: 2
      regionCode: CN-33
  - account: yuzhen
    nickname: 悠真
    profile:
      signature: 通勤路上一天一章。
      gender: 1
      regionCode: CN-31
  - account: ling
    nickname: 铃
    profile:
      signature: 喜欢在书页边写批注。
      gender: 2
      regionCode: CN-32
  - account: che
    nickname: 彻
    profile:
      signature: 读完必写长评。
      gender: 1
      regionCode: CN-51
  - account: mingli
    nickname: 明里
    profile:
      signature: 偏爱治愈系和日常向。
      gender: 2
      regionCode: CN-35
  - account: lian
    nickname: 莲
    profile:
      signature: 在图书馆工作，顺手整理书单。
      gender: 2
      regionCode: CN-42

# 好友关系（双向保存）。sakuya 的好友共 6 位，与测试断言一致。
friendships:
  - { a: sakuya, b: alice }
  - { a: sakuya, b: bob }
  - { a: alice, b: bob }
  - { a: sakuya, b: qianxia }
  - { a: sakuya, b: yuzhen }
  - { a: sakuya, b: ling }
  - { a: sakuya, b: che }
  # 新账号彼此之间也建立关系，使其个人主页看起来是真实使用过的账号。
  - { a: qianxia, b: yuzhen }
  - { a: qianxia, b: mingli }
  - { a: ling, b: che }
  - { a: mingli, b: lian }
  - { a: yuzhen, b: lian }

# 单向关注，喂给「关注」动态流。刻意不给 alice/bob 加关注，
# 因为 AuthApiIntegrationTest#publicProfileAndFollowApisUseProfilesPath 断言 alice 关注列表的第一项是 bob。
follows:
  - { follower: sakuya, following: qianxia }
  - { follower: sakuya, following: yuzhen }
  - { follower: sakuya, following: ling }
  - { follower: sakuya, following: che }
  - { follower: qianxia, following: sakuya }
  - { follower: yuzhen, following: sakuya }
  - { follower: ling, following: mingli }
  - { follower: che, following: qianxia }
  - { follower: mingli, following: sakuya }
  - { follower: lian, following: qianxia }

# 待处理好友申请。发给 sakuya 的只能有 rin 一条（见文件头说明）。
friendRequests:
  - { from: rin, to: sakuya, message: 一起交流最近读的轻小说吧 }
  - { from: mingli, to: alice, message: 看到你也在读治愈系，交个朋友 }
  - { from: lian, to: bob, message: 想请教一下硬核推理的入门书单 }

# sakuya 的书架保持 3 本，与测试断言一致。
library:
  - { account: sakuya, bookId: sword-art-online, progress: 0.68 }
  - { account: sakuya, bookId: rezero, progress: 0.25 }
  - { account: sakuya, bookId: spice-and-wolf, progress: 1.0 }

# sakuya 的会话保持 2 个，与测试断言一致。
conversations:
  - participants: [sakuya, alice]
    messages:
      - { from: alice, content: 欢迎来到 Sakuya！ }
      - { from: alice, content: 我刚把《刀剑神域》加入书架。 }
      - { from: sakuya, content: 那本我最近也在看，进度刚过一半。 }
  - participants: [sakuya, bob]
    messages:
      - { from: bob, content: 周末一起聊聊最近读的书吗？ }
      - { from: sakuya, content: 好啊，我把书单整理一下发你。 }
  - participants: [qianxia, yuzhen]
    messages:
      - { from: qianxia, content: 上次推荐的那本短篇集读完了。 }
      - { from: yuzhen, content: 感觉怎么样？ }

# 动态与评论。分散在最近 14 天内，按作者覆盖推荐流、关注流和作者主页三种视图。
posts:
  # —— sakuya ——
  - author: sakuya
    title: 雨天读完《山茶文具店》
    content: 像收到一封温柔的信。书里那些替人写下的话，让这个潮湿的下午也慢慢安静下来。
    tags: [读书笔记, 治愈系]
    daysAgo: 1
    hoursAgo: 3
    likes: [alice, qianxia, ling, mingli]
    favorites: [alice, mingli]
    comments:
      - { author: alice, content: 这本我也很喜欢，代笔的设定很特别。 }
      - { author: qianxia, content: 同感，尤其是写吊唁信那几章。 }
      - { author: sakuya, content: 对，那几章我反复看了两遍。 }
      - { author: qianxia, content: 看来要找来读读了。 }
  - author: sakuya
    title: 给八月列了一张待读清单
    content: 想把阅读的速度放慢一点，留些空白给散步和发呆。
    tags: [待读书单, 八月阅读]
    daysAgo: 6
    likes: [bob, che]
    favorites: []
    comments:
      - { author: che, content: 清单里有没有推理？求推荐。 }
      - { author: sakuya, content: 有，加了一本《古书堂事件手帖》。 }

