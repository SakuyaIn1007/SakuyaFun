plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.jetbrains.kotlin.compose)
    alias(libs.plugins.devtools.ksp)
    alias(libs.plugins.hilt.android)
}

android {
    namespace 'com.sakuya.search'
    compileSdk 35
    defaultConfig { minSdk 24; targetSdk 35 }
    buildFeatures { compose = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions { jvmTarget = '11' }
}

dependencies {
    implementation project(':core:data')
    implementation project(':core:model')
    implementation project(':core:navigation')
    // 读取 SakuyaTheme 令牌需要。core:data / core:model / core:navigation 对 core:ui
    // 均为 implementation（不传导），故必须显式声明，否则编译期读不到令牌。
    implementation project(':core:ui')
    implementation libs.bundles.feature.ui
    implementation libs.androidx.navigation.compose
    implementation libs.datastore.preferences
    ksp libs.hilt.compiler
    testImplementation libs.junit
    testImplementation libs.kolinx.coroutines.test
}
