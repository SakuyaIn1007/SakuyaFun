plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.devtools.ksp)
    alias(libs.plugins.hilt.android)
}

android {
    namespace 'com.sakuya.data'
    compileSdk 35

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${project.findProperty("apiBaseUrl") ?: "http://10.0.2.2:8080/"}\""
            buildConfigField "String", "WS_CHAT_URL", "\"${project.findProperty("wsChatUrl") ?: "ws://10.0.2.2:8080/ws/chat"}\""
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${project.findProperty("apiBaseUrl") ?: "https://api.sakuya.com/"}\""
            buildConfigField "String", "WS_CHAT_URL", "\"${project.findProperty("wsChatUrl") ?: "wss://api.sakuya.com/ws/chat"}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    api project(":core:model")
    api libs.retrofit2
    api libs.retrofit2.converter.gson
    api libs.okhttp3
    //  Room依赖
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.hilt.android
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    ksp libs.hilt.compiler
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
